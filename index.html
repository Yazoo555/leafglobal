<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Leaf Global Consulting Group — Education, Law, IT & Finance consulting and training specialists. Expert guidance to empower your organisation." />
    <meta name="theme-color" content="#2563EB" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leaf Global Consulting Group — Consulting & Training Specialists" />
    <meta property="og:description" content="Leaf Global Consulting Group — Education, Law, IT & Finance consulting and training specialists. Expert guidance to empower your organisation." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leaf Global Consulting Group — Consulting & Training Specialists" />
    <meta name="twitter:description" content="Leaf Global Consulting Group — Education, Law, IT & Finance consulting and training specialists. Expert guidance to empower your organisation." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>Leaf Global Consulting Group — Consulting & Training Specialists</title>

    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin fetchpriority="high" />

    <!-- Font Preload — Inter -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

  </head>
  <body class="bg-background text-text font-sans antialiased">
    <div id="app">
      <!-- Instant loading placeholder -->
      <div class="flex items-center justify-center min-h-screen bg-background">
        <div class="text-center">
          <div class="w-10 h-10 rounded-full border-4 border-primary-100 border-t-primary animate-spin mx-auto" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
